# CISA 2026 Minimum Elements for a Software Bill of Materials (SBOM), v2.1.
#
# Rule ids, labels and provisions follow the SBOM requirements ontology
# https://bact.github.io/bom/req/cisa2026/; the SPDX 3.0.1 fields follow
# https://bact.github.io/bom/mapping/cisa2026-to-spdx30.sssom.tsv.
# An element whose SPDX 3.0.1 mapping is exact, or whose carrier the checker can
# read directly, is checked. Where the mapping is only close or broad (format
# name and generation context: close; hash: broad), the rule is checked as
# "the carrier is present" and says so in cisa2026.md. An element with no
# usable carrier (signature, tool version, SBOM version) and every Practices and
# Processes element (how SBOMs are run, not what one holds) is catalogue-only:
# listed, never checked.
# Source: https://www.cisa.gov/sites/default/files/2026-07/2026_cisa_sbom_minimum_elements_508c.pdf

spec:
  id: cisa2026
  rule_prefix: BOM-CISA2026
  title: CISA 2026 Minimum Elements for a Software Bill of Materials (SBOM)
  uri: https://www.cisa.gov/sites/default/files/2026-07/2026_cisa_sbom_minimum_elements_508c.pdf
  # Besides composition, follow these from the root to find the components
  # the rules judge: a dataset a reachable model was trained or tested on.
  reach_via: [trainedOn, testedOn]
  sbom_specs: [spdx3]
  taxonomies:
    category: cisa2026-minimum-elements

categories:
  - id: sbom-metadata
    code: META
    title: SBOM Metadata
  - id: component-data
    code: COMP
    title: Component Data
  - id: practices-and-processes
    code: PP
    title: Practices and Processes

rules:

  - number: 1
    slug: cisa2026-sbom-author-missing
    spec_category: sbom-metadata
    element_id: author
    element_description: "SBOM author"
    competency_question: "SBOM author provided?"
    warning: "SBOM author is missing."
    provision: requirement
    probe:
      name: require_document_attribute
      params: {"attribute": "author"}

  - number: 2
